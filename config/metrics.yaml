metrics:
  sales_amount:
    name: 销售额
    aliases: [营收, 销售金额]
    description: 已开具发票的含税金额合计，退款另行统计
    expression: SUM(Invoice.Total)
    required_fields: [time_range]
    unit: 元
  invoice_count:
    name: 发票数量
    aliases: [订单数, 交易笔数]
    description: 符合筛选条件的发票记录数量
    expression: COUNT(Invoice.InvoiceId)
    required_fields: [time_range]
    unit: 张
  customer_count:
    name: 客户数量
    aliases: [客户数]
    description: 符合筛选条件的去重客户数量
    expression: COUNT(DISTINCT Invoice.CustomerId)
    required_fields: [time_range]
    unit: 人
